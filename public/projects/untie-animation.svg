<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <!-- BACKGROUND: Timeline UI -->
  <g stroke="currentColor" fill="none">
    <!-- Clean Timeline Base Track -->
    <line x1="4" y1="44" x2="44" y2="44" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND UI: Timeline Keyframes -->
  <g fill="currentColor">
    <!-- Left Keyframe -->
    <polygon points="10,41 13,44 10,47 7,44" />
    <!-- Center Keyframe (Current Frame) -->
    <polygon points="24,40 28,44 24,48 20,44" />
    <!-- Right Keyframe -->
    <polygon points="38,41 41,44 38,47 35,44" />
  </g>

  <!-- FOREGROUND CHARACTER: Rigged Runner -->
  <!-- Head -->
  <circle cx="32" cy="9" fill="currentColor" r="4.5" />
    
  <!-- Bones (Refined stroke widths to remove "smudging") -->
  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spine & Neck -->
    <line x1="32" y1="11" x2="30" y2="16" stroke-width="3.5" />
    <line x1="30" y1="16" x2="24" y2="28" stroke-width="4" />
    
    <!-- Back Arm (Left) -->
    <line x1="30" y1="16" x2="22" y2="16" stroke-width="3.5" />
    <line x1="22" y1="16" x2="18" y2="9" stroke-width="3.5" />
    
    <!-- Back Leg (Left) -->
    <line x1="24" y1="28" x2="16" y2="33" stroke-width="3.5" />
    <line x1="16" y1="33" x2="8" y2="38" stroke-width="3.5" />
    
    <!-- Front Leg (Right) -->
    <line x1="24" y1="28" x2="33" y2="28" stroke-width="3.5" />
    <line x1="33" y1="28" x2="35" y2="38" stroke-width="3.5" />
    
    <!-- Front Arm (Right) -->
    <line x1="30" y1="16" x2="38" y2="20" stroke-width="3.5" />
    <line x1="38" y1="20" x2="36" y2="28" stroke-width="3.5" />
  </g>

  <!-- RIGGING POINTS: Clean white joint indicators -->
  <g fill="white">
    <!-- Shoulders/Hips -->
    <circle cx="30" cy="16" r="1" />
    <circle cx="24" cy="28" r="1" />
    <!-- Elbows -->
    <circle cx="38" cy="20" r="1" />
    <circle cx="22" cy="16" r="1" />
    <!-- Knees -->
    <circle cx="33" cy="28" r="1" />
    <circle cx="16" cy="33" r="1" />
  </g>
</svg>